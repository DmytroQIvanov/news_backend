services:
  - type: web
    name: opportunity-radar-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_POOL_MAX
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: INGEST_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash-lite"
      - key: GEMINI_RESEARCH
        value: "false"
      - key: CORS_ORIGINS
        value: ""
      - key: DB_KEEPALIVE_INTERVAL_MS
        value: "240000"
