services:
  - type: web
    name: opportunity-radar-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_POOL_MAX
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: INGEST_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash-lite"
      - key: GEMINI_RESEARCH
        value: "false"
      - key: apify_token
        sync: false
      - key: YOUTUBE_MAX_DAILY_TRANSCRIPTIONS
        value: "30"
      - key: YOUTUBE_MAX_DAILY_APIFY
        value: "5"
      - key: CORS_ORIGINS
        value: ""
      - key: DB_KEEPALIVE_INTERVAL_MS
        value: "240000"
      - key: cloudflare_account_id
        sync: false
      - key: cloudflare_api_token
        sync: false
      - key: cloudflare_access_key_id
        sync: false
      - key: cloudflare_secret_access_key
        sync: false
      - key: cloudflare_s3_api_endpoint
        sync: false
      - key: cloudflare_r2_bucket
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: BLUESKY_HANDLE
        sync: false
      - key: BLUESKY_APP_PASSWORD
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: groq_api_key
        sync: false
      - key: openrouter_api_key
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false
      - key: AUDIO_LANGS
        value: "en,uk"
