name: Knowledge pipeline
on:
  push:
    paths: ['knowledge/**', 'migrations/**', '.github/workflows/knowledge.yml']
  pull_request:
    paths: ['knowledge/**', 'migrations/**']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U radar" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Every migration, including 027 with pgvector/pg_trgm, must apply cleanly on a fresh database.
      - run: node scripts/migrate.cjs
        env:
          DATABASE_URL: postgresql://radar:radar@127.0.0.1:5432/radar
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: knowledge/requirements.txt
      - run: pip install -r knowledge/requirements.txt pytest && python -m spacy download en_core_web_sm && python -m spacy download uk_core_news_sm
      - run: python -m pytest knowledge/tests -q -p no:cacheprovider
        env:
          PYTHONPATH: knowledge
          KB_TEST_DATABASE_URL: postgresql://radar:radar@127.0.0.1:5432/radar
          KB_REQUIRE_QUALITY_TESTS: 'true'
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t news-kb-worker:ci knowledge
      - run: docker run --rm --entrypoint python news-kb-worker:ci -c "import kb.nlp.pipeline, spacy; [spacy.load(m) for m in ('en_core_web_sm','uk_core_news_sm')]; print('ok')"
