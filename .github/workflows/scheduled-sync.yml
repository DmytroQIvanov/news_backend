name: Scheduled News & Encyclopedia Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_API_URL != '' && secrets.INGEST_API_KEY != '' }}
    steps:
      - name: Trigger backend sync
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          curl --fail --show-error --silent --max-time 120 \
            -X POST "${RENDER_API_URL%/}/api/v1/ingest/sync" \
            -H "x-ingest-key: ${INGEST_API_KEY}" \
            -H "Content-Type: application/json"
